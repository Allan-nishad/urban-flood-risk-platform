[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "floodrisk"
version = "0.1.0"
description = "AI-Based Early Detection and Forecasting of Urban Flood Risks Using Satellite and Weather Data"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Urban Flood Risk Platform Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Hydrology"
]
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.6.0",
    "click>=8.1.0",
    "joblib>=1.3.0"
]

[project.optional-dependencies]
geo = [
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "geopandas>=0.14.0",
    "rasterio>=1.3.0"
]
dev = [
    "pytest>=8.0.0"
]

[project.scripts]
floodrisk = "floodrisk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
pythonpath = [
    "src"
]
testpaths = [
    "tests"
]
